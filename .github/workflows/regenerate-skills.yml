name: Weekly Skill Regeneration

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requiems-api-skills
        uses: actions/checkout@v7

      - name: Checkout requiems-api (source of YAML docs)
        uses: actions/checkout@v7
        with:
          repository: bobadilla-tech/requiems-api
          path: requiems-api

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate skills
        run: |
          node scripts/build.ts \
            --source requiems-api/apps/dashboard/config/api_docs \
            --output ./skills

      - name: Detect changes in skills/
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- skills/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Build PR body
        run: |
          {
            echo "Skills regenerated automatically from the latest \`requiems-api\` documentation."
            echo ""
            echo "Triggered by: ${{ github.event_name }}"
            echo ""
            apis="$(git status --porcelain -- skills/ | awk '{print $2}' | cut -d/ -f2 | sed -E 's/-(get|post|put|patch|delete)-.*$//' | sort -u)"
            if [ -n "$apis" ]; then
              echo "<details>"
              echo "<summary>Changed API doc pages to spot-check</summary>"
              echo ""
              echo "Verify each endpoint below is still current — links are built from the API's \`api_id\`, which doesn't always match the source YAML filename 1:1."
              echo ""
              echo "$apis" | while read -r api; do
                echo "- [$api](https://requiems.xyz/en/apis/$api)"
              done
              echo ""
              echo "</details>"
            fi
          } > pr-body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate skills from latest api_docs"
          title: "Automated: Weekly Skill Regeneration"
          body-path: pr-body.md
          team-reviewers: requiems-api
          branch: "chore/automated-skill-regeneration"
          base: "main"
          delete-branch: true
